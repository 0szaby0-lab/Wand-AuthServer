<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wand Elite - Admin Vezérlőpult</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --primary: #8A2BE2;
            --primary-hover: #9c42f5;
            --accent: #FFD700;
            --danger: #f04343;
            --success: #08fc81;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(138, 43, 226, 0.3);
            --text: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            color: var(--accent);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            margin: 0;
        }

        .login-box {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
        }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: #ff5c5c;
            box-shadow: 0 0 15px rgba(240, 67, 67, 0.6);
        }
        
        .btn-success {
            background: var(--success);
            color: black;
        }

        .dashboard {
            display: none;
        }

        .add-form {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(138, 43, 226, 0.2);
            font-weight: 600;
            color: var(--accent);
        }

        .status-active { color: var(--success); font-weight: bold;}
        .status-inactive { color: var(--danger); font-weight: bold;}
        .status-expired { color: #FFA500; font-weight: bold;}

        .action-btns {
            display: flex;
            gap: 5px;
        }
        
        .action-btns button {
            padding: 6px 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="login-box">
        <h2>Admin Bejelentkezés</h2>
        <input type="password" id="adminPwd" placeholder="Mesterjelszó" onkeyup="if(event.key === 'Enter') login()">
        <button onclick="login()">Belépés</button>
    </div>

    <div id="dashboardSection" class="dashboard">
        <div class="header">
            <h1>Wand Elite Admin</h1>
            <button onclick="logout()">Kijelentkezés</button>
        </div>

        <div class="add-form">
            <div>
                <label>HWID (Ügyfél gépkódja)</label>
                <input type="text" id="newHwid" placeholder="WE-XXXX-XXXX-XXXX" style="margin-bottom:0">
            </div>
            <div>
                <label>Napok száma</label>
                <input type="number" id="newDays" value="30" min="1" style="margin-bottom:0">
            </div>
            <div>
                <label>Név (opcionális)</label>
                <input type="text" id="newName" placeholder="Pl. Pisti" style="margin-bottom:0">
            </div>
            <button onclick="addSubscription()">Hozzáadás / Hosszabbítás</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Gép / Név</th>
                    <th>HWID</th>
                    <th>Lejárat</th>
                    <th>Állapot</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="subsTableBody">
                <!-- Data will load here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let token = localStorage.getItem('wand_admin_pwd') || '';
    const API_URL = '/api/admin/subs';

    if(token) {
        showDashboard();
        loadSubs();
    }

    function login() {
        token = document.getElementById('adminPwd').value;
        if(!token) return alert('Írd be a jelszót!');
        localStorage.setItem('wand_admin_pwd', token);
        showDashboard();
        loadSubs();
    }

    function logout() {
        token = '';
        localStorage.removeItem('wand_admin_pwd');
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
    }

    function showDashboard() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
    }

    async function authFetch(url, options = {}) {
        options.headers = {
            ...options.headers,
            'x-admin-password': token,
            'Content-Type': 'application/json'
        };
        const res = await fetch(url, options);
        if(res.status === 401) {
            alert('Hibás jelszó!');
            logout();
            throw new Error('Unauthorized');
        }
        return res.json();
    }

    async function loadSubs() {
        try {
            const subs = await authFetch(API_URL);
            const tbody = document.getElementById('subsTableBody');
            tbody.innerHTML = '';

            const now = new Date();

            subs.forEach(sub => {
                const expires = new Date(sub.expiresAt);
                const isExpired = expires < now;
                
                let statusHtml = '';
                if(isExpired) statusHtml = '<span class="status-expired">Lejárt</span>';
                else if(sub.isActive) statusHtml = '<span class="status-active">Aktív</span>';
                else statusHtml = '<span class="status-inactive">Felfüggesztve</span>';

                const nameDisplay = sub.userName ? `${sub.userName} (${sub.machineName})` : (sub.machineName || 'Ismeretlen');

                tbody.innerHTML += `
                    <tr>
                        <td>${nameDisplay}</td>
                        <td style="font-family:monospace; color: #aaa">${sub.hwid}</td>
                        <td>${expires.toLocaleString('hu-HU')}</td>
                        <td>${statusHtml}</td>
                        <td class="action-btns">
                            <button class="${sub.isActive ? 'btn-danger' : 'btn-success'}" onclick="toggleKillswitch('${sub._id}')">
                                ${sub.isActive ? 'Bannolás (Kill)' : 'Engedélyezés'}
                            </button>
                            <button class="btn-danger" style="background:#555" onclick="deleteSub('${sub._id}')">Törlés</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) { console.error(e); }
    }

    async function addSubscription() {
        const hwid = document.getElementById('newHwid').value.trim();
        const days = parseInt(document.getElementById('newDays').value);
        const name = document.getElementById('newName').value.trim();

        if(!hwid || !days) return alert('HWID és Napok száma kötelező!');

        await authFetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ hwid, daysToAdd: days, userName: name })
        });
        
        document.getElementById('newHwid').value = '';
        document.getElementById('newName').value = '';
        loadSubs();
    }

    async function toggleKillswitch(id) {
        await authFetch(`${API_URL}/${id}/toggle`, { method: 'PUT' });
        loadSubs();
    }

    async function deleteSub(id) {
        if(!confirm('Biztosan törlöd ezt az előfizetést véglegesen?')) return;
        await authFetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadSubs();
    }
</script>

</body>
</html>
